services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: addressbook
      POSTGRES_PASSWORD: addressbook
      POSTGRES_DB: addressbook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "addressbook"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

# Fluent Bit — single collector for logs, metrics, and traces.
# Routes each signal to its OpenObserve ingestion endpoint.

[SERVICE]
    flush        1
    log_level    info
    parsers_file parsers.conf
    http_server  On
    http_listen  0.0.0.0
    http_port    2020

# ─── Inputs ─────────────────────────────────────────────────────────────

# Docker container logs (via Docker fluentd log driver)
[INPUT]
    name         forward
    listen       0.0.0.0
    port         24224
    tag          docker.*

# Postgres metrics (pulls postgres-exporter /metrics every 15s)
[INPUT]
    name         prometheus_scrape
    host         postgres-exporter
    port         9187
    scrape_interval 15s
    tag          metrics

# Go app metrics (scrapes the server /api/metrics endpoint every 15s)
# host.docker.internal = Docker Desktop host where the server runs
[INPUT]
    name         prometheus_scrape
    host         host.docker.internal
    port         8080
    metrics_path /api/metrics
    scrape_interval 15s
    tag          metrics

# Application traces (OTLP HTTP from xotel middleware)
[INPUT]
    name         opentelemetry
    listen       0.0.0.0
    port         4318
    tag          traces

# ─── Outputs ────────────────────────────────────────────────────────────

# Logs → OpenObserve ES-compatible bulk ingestion API
[OUTPUT]
    name         es
    match        docker.*
    host         openobserve
    port         5080
    path         /api/default
    index        default
    http_user    admin@example.com
    http_passwd  Admin@12345
    type         _doc
    replace_dots On
    suppress_type_name On

# Metrics → OpenObserve Prometheus remote write
[OUTPUT]
    name         prometheus_remote_write
    match        metrics
    host         openobserve
    port         5080
    uri          /api/default/prometheus/api/v1/write
    header       Authorization Basic YWRtaW5AZXhhbXBsZS5jb206QWRtaW5AMTIzNDU=

# Traces + metrics → OpenObserve OTLP endpoints
[OUTPUT]
    name         opentelemetry
    match        *
    host         openobserve
    port         5080
    http_user    admin@example.com
    http_passwd  Admin@12345
    traces_uri   /api/default/v1/traces
    metrics_uri  /api/default/v1/metrics
